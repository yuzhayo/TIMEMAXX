[package]
name = "timemark-engine"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
ab_glyph = "0.2.32"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde_json = "1"

[[bin]]
name = "engine-render"
path = "src/lib.rs"

[profile.release]
opt-level = 1
strip = true
